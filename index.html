<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>bSoul — Calendario Social</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,500&display=swap" rel="stylesheet">
  <style>
/* Stile del Sentiero (pagina approvata: schema_sistema_contenuti_2026-08-23.html) con i colori del Brand Book bSoul:
   fondo con griglia leggera, pannelli, etichette mono, un solo accento (marrone); verde, sabbia e ruggine solo per lo stato.
   Il tema segue quello del dispositivo (chiaro o scuro). */
:root{
  --bg:#0a0b0d;--surface:#121317;--surface-2:#17181d;--fg:#ececef;--muted:#8b909a;--faint:#5d626c;--line:#24262c;--grid:rgba(255,255,255,.035);
  --accent:#ebb284;--accent-soft:rgba(235,178,132,.14);--on-accent:#0a0b0d;
  --ok:#bcc482;--ok-soft:rgba(188,196,130,.12);--warn:#a68a64;--warn-soft:rgba(166,138,100,.14);--bad:#dc7623;--bad-soft:rgba(220,118,35,.12);
  --sans:"Geist","Helvetica Neue",Helvetica,Arial,sans-serif;--mono:"Geist Mono",ui-monospace,"SF Mono",Menlo,monospace;
  color-scheme:dark}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#f7f7f8;--surface:#ffffff;--surface-2:#f3f3f5;--fg:#16171a;--muted:#5e636d;--faint:#9a9ea7;--line:#e3e4e8;--grid:rgba(0,0,0,.04);
  --accent:#582f0e;--accent-soft:rgba(88,47,14,.09);--on-accent:#ffffff;
  --ok:#656d4a;--ok-soft:rgba(101,109,74,.09);--warn:#816137;--warn-soft:rgba(166,138,100,.12);--bad:#9a5218;--bad-soft:rgba(154,82,24,.08);
  color-scheme:light}}
:root[data-theme="light"]{
  --bg:#f7f7f8;--surface:#ffffff;--surface-2:#f3f3f5;--fg:#16171a;--muted:#5e636d;--faint:#9a9ea7;--line:#e3e4e8;--grid:rgba(0,0,0,.04);
  --accent:#582f0e;--accent-soft:rgba(88,47,14,.09);--on-accent:#ffffff;
  --ok:#656d4a;--ok-soft:rgba(101,109,74,.09);--warn:#816137;--warn-soft:rgba(166,138,100,.12);--bad:#9a5218;--bad-soft:rgba(154,82,24,.08);
  color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background-color:var(--bg);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:32px 32px;color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@keyframes in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@keyframes beat{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 60%,transparent)}70%,100%{box-shadow:0 0 0 8px transparent}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

    html,body{min-height:100%}
    body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
    .gate{width:min(100%,430px);border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:32px}
    .label{margin:0 0 12px;display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
    .label::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none}
    h1{margin:0;font-size:clamp(1.5rem,5vw,1.9rem);line-height:1.12;font-weight:600;letter-spacing:-.015em}
    p{margin:12px 0 22px;color:var(--muted);font-size:.95rem;line-height:1.55}
    form{display:grid;gap:12px}
    input,button{width:100%;min-height:48px;font:inherit;font-size:15px;border-radius:6px}
    input{border:1px solid var(--line);background:var(--surface-2);color:var(--fg);padding:0 14px;outline:none}
    input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
    button{border:1px solid var(--accent);background:var(--accent);color:var(--on-accent);font-family:var(--mono);font-size:.78rem;
      font-weight:500;cursor:pointer;text-transform:uppercase;letter-spacing:.08em;transition:opacity .15s}
    button:hover,button:focus-visible{opacity:.88}
    .error{min-height:18px;color:var(--bad);font-family:var(--mono);font-size:.74rem}
    iframe{display:none;width:100vw;height:100vh;border:0;background:var(--bg)}
    body.unlocked{display:block;min-height:100vh;padding:0;overflow:hidden}
    body.unlocked .gate{display:none}
    body.unlocked iframe{display:block}
    @media (max-width:520px){.gate{padding:26px 22px}}

/* titolo al centro (regola di Nic 14/10) */
.gate .label,.gate h1,.gate>p{text-align:center}.gate .label{justify-content:center}
</style>
</head>
<body>
  <main class="gate" aria-labelledby="page-title">
    <div class="label">bSoul · Materiale riservato</div>
    <h1 id="page-title">Calendario Social</h1>
    <p>Inserisci la password ricevuta per vedere il materiale della settimana.</p>
    <form id="password-form" autocomplete="off">
      <input id="password" type="password" placeholder="Password" aria-label="Password" autofocus>
      <button type="submit">Entra</button>
      <div class="error" id="error" role="status" aria-live="polite"></div>
    </form>
  </main>

  <iframe id="content" src="hub.html" title="Calendario Social bSoul" allow="clipboard-write"></iframe>

  <script>
    const PASSWORD = "Minima05";
    const SESSION_KEY = "bsoul_calendario_social_auth";

    function unlock(){ document.body.classList.add("unlocked"); }

    if (sessionStorage.getItem(SESSION_KEY) === PASSWORD) { unlock(); }

    document.getElementById("password-form").addEventListener("submit", function(event){
      event.preventDefault();
      const input = document.getElementById("password");
      const error = document.getElementById("error");

      if (input.value === PASSWORD) {
        sessionStorage.setItem(SESSION_KEY, PASSWORD);
        unlock();
        return;
      }

      error.textContent = "Password non valida";
      input.value = "";
      input.focus();
    });
  </script>
</body>
</html>
