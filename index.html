<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>bSoul — Calendario social</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,500&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#16161b;--card:#20202a;--ink:#f2f2f6;--muted:#a2a2b2;--violet:#6b4bb8;--violet-dark:#5b3e9e;--line:#33333f}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
      font-family:"DM Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
    .gate{width:min(100%,430px);border:1px solid var(--line);background:var(--card);
      box-shadow:0 20px 60px rgba(0,0,0,.35);padding:34px}
    .label{margin:0 0 12px;color:#b9a9e8;font-family:"Poppins",sans-serif;font-size:11px;
      font-weight:600;letter-spacing:.16em;text-transform:uppercase}
    h1{margin:0;font-family:"Poppins",sans-serif;font-size:clamp(22px,5vw,28px);line-height:1.12;
      font-weight:800;text-transform:uppercase;letter-spacing:-.01em}
    p{margin:14px 0 24px;color:var(--muted);font-size:15px;line-height:1.55}
    form{display:grid;gap:12px}
    input,button{width:100%;min-height:48px;font:inherit;font-size:15px;border-radius:0}
    input{border:1px solid var(--line);background:#16161b;color:var(--ink);padding:0 14px;outline:none}
    input:focus{border-color:var(--violet);box-shadow:0 0 0 3px rgba(107,75,184,.25)}
    button{border:0;background:var(--violet);color:#fff;font-family:"Poppins",sans-serif;
      font-weight:700;cursor:pointer;text-transform:uppercase;letter-spacing:.08em;font-size:13px}
    button:hover,button:focus-visible{background:var(--violet-dark)}
    .error{min-height:18px;color:#e08a7a;font-size:13px}
    iframe{display:none;width:100vw;height:100vh;border:0;background:#f4f1ec}
    body.unlocked{display:block;min-height:100vh;padding:0;overflow:hidden}
    body.unlocked .gate{display:none}
    body.unlocked iframe{display:block}
    @media (max-width:520px){body{padding:16px}.gate{padding:26px 22px}}
  </style>
</head>
<body>
  <main class="gate" aria-labelledby="page-title">
    <div class="label">bSoul · Materiale riservato</div>
    <h1 id="page-title">Calendario social</h1>
    <p>Inserisci la password ricevuta per vedere il materiale della settimana.</p>
    <form id="password-form" autocomplete="off">
      <input id="password" type="password" placeholder="Password" aria-label="Password" autofocus>
      <button type="submit">Entra</button>
      <div class="error" id="error" role="status" aria-live="polite"></div>
    </form>
  </main>

  <iframe id="content" src="hub.html" title="Calendario social bSoul" allow="clipboard-write"></iframe>

  <script>
    const PASSWORD = "Minima05";
    const SESSION_KEY = "bsoul_calendario_social_auth";

    function unlock(){ document.body.classList.add("unlocked"); }

    if (sessionStorage.getItem(SESSION_KEY) === PASSWORD) { unlock(); }

    document.getElementById("password-form").addEventListener("submit", function(event){
      event.preventDefault();
      const input = document.getElementById("password");
      const error = document.getElementById("error");

      if (input.value === PASSWORD) {
        sessionStorage.setItem(SESSION_KEY, PASSWORD);
        unlock();
        return;
      }

      error.textContent = "Password non valida";
      input.value = "";
      input.focus();
    });
  </script>
</body>
</html>
